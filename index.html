<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BS Box - Conecta Varejo</title>

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#222222">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="./logo_conecta.png">

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

body{
font-family:Arial;
margin:0;
background:#f2f2f2;
}

header{
background:white;
padding:10px;
display:flex;
align-items:center;
gap:10px;
border-bottom:1px solid #ddd;
}

header img{
height:45px;
}

.container{
display:flex;
height:calc(100vh - 70px);
}

.catalogo{
flex:2;
overflow:auto;
padding:10px;
}

.pedido{
flex:1;
background:white;
border-left:1px solid #ddd;
padding:10px;
display:flex;
flex-direction:column;
}

.pedidoItens{
flex:1;
overflow:auto;
font-size:14px;
margin-bottom:10px;
}

textarea,
input,
select{
width:100%;
padding:8px;
margin-top:5px;
box-sizing:border-box;
}

.card{
background:white;
border-radius:8px;
padding:10px;
margin:6px 0;
display:flex;
justify-content:space-between;
gap:10px;
}

.qty{
display:flex;
flex-direction:column;
gap:5px;
}

.qty input{
width:70px;
text-align:center;
}

.valorEditavel{
width:100px;
padding:5px;
margin-top:5px;
}

.itemPedido{
background:#f8f8f8;
padding:8px;
border-radius:6px;
margin-bottom:8px;
}

button{
padding:8px;
border:none;
border-radius:6px;
background:#222;
color:white;
cursor:pointer;
}

.botoes{
display:flex;
gap:5px;
}

.total{
font-weight:bold;
font-size:18px;
margin-top:10px;
}

@media(max-width:900px){

.container{
flex-direction:column;
}

.catalogo{
height:55vh;
}

.pedido{
height:45vh;
border-top:1px solid #ddd;
}

}

</style>

</head>

<body>

<header>

<img src="./logo_conecta.png">

<div>
<b>Conecta Varejo</b><br>
Sistema de Pedidos
</div>

</header>

<div class="container">

<div class="catalogo">

<h2>Catálogo</h2>

<button onclick="carregarCatalogo()">
Atualizar catálogo
</button>

<br><br>

<input id="cliente" placeholder="Cliente">

<br>

<input id="busca" placeholder="Buscar produto ou código">

<br><br>

<select id="filtroCategoria"></select>

<br><br>

<select id="filtroFornecedor"></select>

<div id="lista"></div>

</div>

<div class="pedido">

<h3 id="pedidoNumero"></h3>

<div class="pedidoItens" id="pedido"></div>

<div class="total" id="totalPedido"></div>

<textarea id="observacao" placeholder="Observações"></textarea>

<div class="botoes">

<button onclick="novoPedido()">
Novo
</button>

<button onclick="gerarPDF()">
PDF
</button>

<button onclick="gerarExcel()">
Excel
</button>

</div>

</div>

</div>

<script>

let produtos = []

let pedido = {}

let numeroPedido = gerarNumeroPedido()

const lista =
document.getElementById("lista")

const pedidoBox =
document.getElementById("pedido")

document.getElementById("pedidoNumero")
.innerText =
"Pedido " + numeroPedido

function gerarNumeroPedido(){

let d = new Date()

return d.getFullYear()
+
("0"+(d.getMonth()+1)).slice(-2)
+
("0"+d.getDate()).slice(-2)
+
"-"
+
("0"+d.getHours()).slice(-2)
+
("0"+d.getMinutes()).slice(-2)

}

function normalizar(t){

return (t || "")
.toLowerCase()
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"")

}

function numero(valor){

if(valor === null || valor === undefined || valor === ""){
return 0
}

if(typeof valor === "number"){
return valor
}

let texto =
String(valor)
.replace("R$","")
.replace(/\s/g,"")
.trim()

if(texto === "-" || texto === ""){
return 0
}

let negativo = false

if(texto.startsWith("(") && texto.endsWith(")")){
negativo = true
texto = texto.slice(1,-1)
}

const temVirgula =
texto.includes(",")

const temPonto =
texto.includes(".")

if(temVirgula && temPonto){

texto =
texto.replace(/\./g,"")
.replace(",",".")

}else if(temVirgula){

texto =
texto.replace(",",".")

}

const convertido =
parseFloat(texto)

if(isNaN(convertido)){
return 0
}

return negativo ? convertido * -1 : convertido

}

function dinheiro(valor){

return Number(valor || 0)
.toFixed(2)
.replace(".",",")

}

async function carregarCatalogo(){

lista.innerHTML =
"Carregando catálogo..."

try{

const response =
await fetch("./base_de_produtos.xlsx")

const data =
await response.arrayBuffer()

const workbook =
XLSX.read(data,{type:"array"})

const sheet =
workbook.Sheets[
workbook.SheetNames[0]
]

const json =
XLSX.utils.sheet_to_json(
sheet,
{
header:1,
raw:false
}
)

produtos = json.slice(1)

.filter(l=>l[0])

.map(l=>({

codigo:String(l[0]),

categoria:l[1] || "",

descricao:l[2] || "",

fornecedor:l[3] || "",

valorUnit:numero(l[4]),

valorCaixa:numero(l[5]),

volume:parseInt(l[6]) || 1,

busca:
normalizar(
String(l[0]) + " " + (l[2] || "")
)

}))

popularFiltros()

renderCatalogo()

}catch(e){

console.error(e)

lista.innerHTML =
"Erro ao carregar catálogo"

}

}

function popularFiltros(){

const categorias =
[...new Set(
produtos.map(p=>p.categoria).filter(c=>c)
)]

const fornecedores =
[...new Set(
produtos.map(p=>p.fornecedor).filter(f=>f)
)]

const cat =
document.getElementById("filtroCategoria")

const forn =
document.getElementById("filtroFornecedor")

cat.innerHTML =
'<option value="">Categorias</option>'

forn.innerHTML =
'<option value="">Fornecedores</option>'

categorias.forEach(c=>{

cat.innerHTML +=
`<option value="${c}">
${c}
</option>`

})

fornecedores.forEach(f=>{

forn.innerHTML +=
`<option value="${f}">
${f}
</option>`

})

}

function renderCatalogo(){

const busca =
normalizar(
document.getElementById("busca").value
)

const categoria =
document.getElementById("filtroCategoria").value

const fornecedor =
document.getElementById("filtroFornecedor").value

lista.innerHTML = ""

const fragment =
document.createDocumentFragment()

let filtrados =
produtos.filter(p=>{

const okBusca =
p.busca.includes(busca)

const okCat =
!categoria ||
p.categoria === categoria

const okFor =
!fornecedor ||
p.fornecedor === fornecedor

return okBusca && okCat && okFor

})

filtrados =
filtrados.slice(0,100)

filtrados.forEach(p=>{

const div =
document.createElement("div")

div.className = "card"

div.innerHTML = `

<div>

<b>${p.descricao}</b><br>

Cod: ${p.codigo}<br>

Unitário: R$ ${dinheiro(p.valorUnit)}<br>

Caixa: R$ ${dinheiro(p.valorCaixa)}<br>

<small>
Volume: ${p.volume} un/caixa
</small>

</div>

<div class="qty">

<input
type="number"
min="1"
step="1"
value="1"
id="q_${p.codigo}">

<button data-cod="${p.codigo}">
Add
</button>

</div>
`

fragment.appendChild(div)

})

lista.appendChild(fragment)

}

lista.addEventListener("click", e=>{

if(e.target.tagName !== "BUTTON")
return

const codigo =
e.target.dataset.cod

if(!codigo) return

addItem(codigo)

})

function addItem(codigo){

const input =
document.getElementById(
"q_"+codigo
)

const qtd =
parseInt(input.value)

const prod =
produtos.find(
p=>p.codigo === codigo
)

if(!qtd || qtd < 1){

alert(
"Informe a quantidade de caixas"
)

return

}

pedido[codigo] = {

codigo:prod.codigo,

produto:prod.descricao,

qtd:qtd,

volume:prod.volume,

valorUnit:prod.valorUnit,

valor:prod.valorCaixa,

fornecedor:prod.fornecedor

}

renderPedido()

}

function alterarValor(codigo, novoValor){

novoValor =
numero(novoValor)

if(isNaN(novoValor) || novoValor < 0){

alert(
"Informe um valor válido"
)

renderPedido()

return

}

pedido[codigo].valor = novoValor

renderPedido()

}

function renderPedido(){

pedidoBox.innerHTML = ""

let total = 0

const fragment =
document.createDocumentFragment()

Object.values(pedido)
.forEach(p=>{

const subtotal =
p.qtd * p.valor

total += subtotal

const div =
document.createElement("div")

div.className = "itemPedido"

div.innerHTML = `

<b>${p.produto}</b><br>

${p.codigo}<br><br>

Qtd caixas:
${p.qtd}x

<br>

Volume:
${p.volume} un/caixa

<br>

Valor unitário original:
R$ ${dinheiro(p.valorUnit)}

<br><br>

Valor da Caixa:

<input
type="text"
inputmode="decimal"
class="valorEditavel"
value="${dinheiro(p.valor)}"
onchange="alterarValor('${p.codigo}', this.value)">

<br>

<small>
Edite este valor para aplicar desconto. Ex: 90,53
</small>

<br><br>

Subtotal:
<b>
R$ ${dinheiro(subtotal)}
</b>

<br><br>

<button onclick="removerItem('${p.codigo}')">
Remover
</button>

`

fragment.appendChild(div)

})

pedidoBox.appendChild(fragment)

document.getElementById("totalPedido")
.innerText =
"Total R$ " + dinheiro(total)

}

function removerItem(codigo){

delete pedido[codigo]

renderPedido()

}

function gerarPDF(){

const cliente =
document.getElementById("cliente").value || "-"

const observacao =
document.getElementById("observacao").value || ""

const dataAtual =
new Date().toLocaleDateString("pt-BR")

const fornecedores = {}

Object.values(pedido).forEach(p=>{

if(!fornecedores[p.fornecedor]){

fornecedores[p.fornecedor] = []

}

fornecedores[p.fornecedor].push(p)

})

for(const fornecedor in fornecedores){

const { jsPDF } = window.jspdf

const pdf = new jsPDF("p","mm","a4")

let y = 15

try{

pdf.addImage(
"./logo_conecta.png",
"PNG",
10,
10,
25,
25
)

}catch(e){

console.log("Logo não carregada")

}

pdf.setFontSize(18)

pdf.text(
"Conecta Varejo",
40,
18
)

pdf.setFontSize(11)

pdf.text(
"18 99617 0377",
40,
25
)

y = 45

pdf.setFontSize(12)

pdf.text(
`Data: ${dataAtual}`,
10,
y
)

pdf.text(
`Pedido: ${numeroPedido}`,
80,
y
)

y += 8

pdf.text(
`Cliente: ${cliente}`,
10,
y
)

y += 12

pdf.setFontSize(14)

pdf.text(
`Fornecedor: ${fornecedor}`,
10,
y
)

y += 10

pdf.setFontSize(10)

pdf.setFont(
"helvetica",
"bold"
)

pdf.text("Código",10,y)

pdf.text("Qtd CX",35,y)

pdf.text("Volume",55,y)

pdf.text("V.Caixa",75,y)

pdf.text("V.Total",105,y)

pdf.text("Descrição",135,y)

y += 2

pdf.line(10,y,200,y)

y += 6

pdf.setFont(
"helvetica",
"normal"
)

let totalPedido = 0

for(const p of fornecedores[fornecedor]){

const totalItem =
p.qtd * p.valor

totalPedido += totalItem

const descricao =
pdf.splitTextToSize(
p.produto,
60
)

pdf.text(
String(p.codigo),
10,
y
)

pdf.text(
String(p.qtd),
35,
y
)

pdf.text(
String(p.volume),
55,
y
)

pdf.text(
"R$ " + dinheiro(p.valor),
75,
y
)

pdf.text(
"R$ " + dinheiro(totalItem),
105,
y
)

pdf.text(
descricao,
135,
y
)

y += Math.max(
descricao.length * 5,
8
)

if(y > 260){

pdf.addPage()

y = 20

}

}

y += 5

pdf.line(10,y,200,y)

y += 10

pdf.setFont(
"helvetica",
"bold"
)

pdf.setFontSize(13)

pdf.text(
"TOTAL DO PEDIDO: R$ "
+ dinheiro(totalPedido),
10,
y
)

y += 15

pdf.setFontSize(12)

pdf.text(
"Observações:",
10,
y
)

y += 8

pdf.setFont(
"helvetica",
"normal"
)

const linhasObs =
pdf.splitTextToSize(
observacao,
180
)

pdf.text(
linhasObs,
10,
y
)

const nomeFornecedor =
fornecedor
.replace(/\s+/g,"_")
.replace(/[^\w]/g,"")

pdf.save(
`${nomeFornecedor}_pedido_${numeroPedido}.pdf`
)

}

}

function gerarExcel(){

let dados = [[
"Fornecedor",
"Codigo",
"Produto",
"Qtd Caixas",
"Volume Un/Caixa",
"Valor Unitario",
"Valor Caixa",
"Subtotal"
]]

Object.values(pedido)
.forEach(p=>{

dados.push([

p.fornecedor,

p.codigo,

p.produto,

p.qtd,

p.volume,

p.valorUnit,

p.valor,

p.qtd*p.valor

])

})

let ws =
XLSX.utils.aoa_to_sheet(dados)

let wb =
XLSX.utils.book_new()

XLSX.utils.book_append_sheet(
wb,
ws,
"Pedido"
)

XLSX.writeFile(
wb,
"pedido_"+numeroPedido+".xlsx"
)

}

function novoPedido(){

pedido = {}

numeroPedido =
gerarNumeroPedido()

document.getElementById("pedidoNumero")
.innerText =
"Pedido " + numeroPedido

document.getElementById("observacao")
.value = ""

renderPedido()

}

let buscaTimer

document.getElementById("busca")
.addEventListener("input", ()=>{

clearTimeout(buscaTimer)

buscaTimer = setTimeout(()=>{

renderCatalogo()

},300)

})

document.getElementById("filtroCategoria")
.addEventListener(
"change",
renderCatalogo
)

document.getElementById("filtroFornecedor")
.addEventListener(
"change",
renderCatalogo
)

if("serviceWorker" in navigator){

window.addEventListener(
"load",
()=>{

navigator.serviceWorker
.register("./sw.js")
.then(reg=>{

console.log(
"SW registrado",
reg
)

})
.catch(err=>{

console.log(
"Erro SW",
err
)

})

})

}

carregarCatalogo()

</script>

</body>
</html>
