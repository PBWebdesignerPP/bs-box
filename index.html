<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BS Box - Conecta Varejo</title>

<link rel="manifest" href="./manifest.json">

<meta name="theme-color" content="#222222">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="default">

<meta name="mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="./logo_conecta.png">

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

body{
font-family:Arial;
margin:0;
background:#f2f2f2;
}

header{
background:white;
padding:10px;
display:flex;
align-items:center;
gap:10px;
border-bottom:1px solid #ddd;
}

header img{
height:45px;
}

.container{
display:flex;
height:calc(100vh - 70px);
}

.catalogo{
flex:2;
overflow:auto;
padding:10px;
}

.pedido{
flex:1;
background:white;
border-left:1px solid #ddd;
padding:10px;
display:flex;
flex-direction:column;
overflow:hidden;
}

.pedidoItens{
flex:1;
overflow-y:auto;
font-size:14px;
margin-bottom:10px;
padding-bottom:120px;
min-height:0;
}

textarea,
input,
select{
width:100%;
padding:8px;
margin-top:5px;
box-sizing:border-box;
}

.card{
background:white;
border-radius:8px;
padding:10px;
margin:6px 0;
display:flex;
justify-content:space-between;
gap:10px;
}

.qty{
display:flex;
flex-direction:column;
gap:5px;
}

.qty input{
width:70px;
text-align:center;
}

button{
padding:8px;
border:none;
border-radius:6px;
background:#222;
color:white;
cursor:pointer;
}

.botoes{
display:flex;
gap:5px;
}

.total{
font-weight:bold;
font-size:18px;
margin-top:10px;
}

@media(max-width:900px){

.container{
flex-direction:column;
}

.catalogo{
height:55vh;
}

.pedido{
height:45vh;
border-top:1px solid #ddd;
overflow:hidden;
}

}

</style>

</head>

<body>

<header>

<img src="./logo_conecta.png">

<div>
<b>Conecta Varejo</b><br>
Sistema de Pedidos
</div>

</header>

<div class="container">

<div class="catalogo">

<h2>Catálogo</h2>

<button onclick="carregarCatalogo()">
Atualizar catálogo
</button>

<br><br>

<input
id="cliente"
placeholder="Cliente">

<br>

<input
id="busca"
placeholder="Buscar produto ou código">

<br><br>

<select id="filtroCategoria"></select>

<br><br>

<select id="filtroFornecedor"></select>

<div id="lista"></div>

</div>

<div class="pedido">

<h3 id="pedidoNumero"></h3>

<div class="pedidoItens" id="pedido"></div>

<div style="margin-top:10px;">

<label>Desconto total (%)</label>

<input
type="number"
id="descontoTotalPercent"
value="0"
min="0"
step="0.01"
oninput="renderPedido()">

<label>Desconto total (R$)</label>

<input
type="number"
id="descontoTotalValor"
value="0"
min="0"
step="0.01"
oninput="renderPedido()">

</div>

<div class="total" id="totalPedido"></div>

<textarea
id="observacao"
placeholder="Observações">
</textarea>

<div class="botoes">

<button onclick="novoPedido()">
Novo
</button>

<button onclick="gerarPDF()">
PDF
</button>

<button onclick="gerarExcel()">
Excel
</button>

</div>

</div>

</div>

<script>

let produtos = []

let pedido = {}

let numeroPedido = gerarNumeroPedido()

const lista =
document.getElementById("lista")

const pedidoBox =
document.getElementById("pedido")

document.getElementById("pedidoNumero")
.innerText =
"Pedido " + numeroPedido

function gerarNumeroPedido(){

let d = new Date()

return d.getFullYear()
+
("0"+(d.getMonth()+1)).slice(-2)
+
("0"+d.getDate()).slice(-2)
+
"-"
+
("0"+d.getHours()).slice(-2)
+
("0"+d.getMinutes()).slice(-2)

}

function normalizar(t){

return (t || "")

.toLowerCase()

.normalize("NFD")

.replace(/[\u0300-\u036f]/g,"")

}

async function carregarCatalogo(){

lista.innerHTML =
"Carregando catálogo..."

try{

const response =
await fetch("./base_de_produtos.xlsx")

const data =
await response.arrayBuffer()

const workbook =
XLSX.read(data,{type:'array'})

const sheet =
workbook.Sheets[
workbook.SheetNames[0]
]

const json =
XLSX.utils.sheet_to_json(
sheet,
{header:1}
)

produtos = json.slice(1)

.filter(l=>l[0])

.map(l=>({

codigo:String(l[0]),

categoria:l[1] || "",

descricao:l[2] || "",

fornecedor:l[3] || "",

valorUnit:parseFloat(l[4]) || 0,

pedidoMin:parseInt(l[6]) || 1,

busca:
normalizar(
String(l[0]) + " " + (l[2] || "")
)

}))

popularFiltros()

renderCatalogo()

}catch(e){

console.error(e)

lista.innerHTML =
"Erro ao carregar catálogo"

}

}

function popularFiltros(){

const categorias =
[...new Set(
produtos.map(p=>p.categoria)
)]

const fornecedores =
[...new Set(
produtos.map(p=>p.fornecedor)
)]

const cat =
document.getElementById(
"filtroCategoria"
)

const forn =
document.getElementById(
"filtroFornecedor"
)

cat.innerHTML =
'<option value="">Categorias</option>'

forn.innerHTML =
'<option value="">Fornecedores</option>'

categorias.forEach(c=>{

cat.innerHTML +=
`<option value="${c}">
${c}
</option>`

})

fornecedores.forEach(f=>{

forn.innerHTML +=
`<option value="${f}">
${f}
</option>`

})

}

function renderCatalogo(){

const busca =
normalizar(
document.getElementById("busca").value
)

const categoria =
document.getElementById(
"filtroCategoria"
).value

const fornecedor =
document.getElementById(
"filtroFornecedor"
).value

lista.innerHTML = ""

const fragment =
document.createDocumentFragment()

let filtrados =
produtos.filter(p=>{

const okBusca =
p.busca.includes(busca)

const okCat =
!categoria ||
p.categoria === categoria

const okFor =
!fornecedor ||
p.fornecedor === fornecedor

return okBusca &&
okCat &&
okFor

})

filtrados =
filtrados.slice(0,100)

filtrados.forEach(p=>{

const div =
document.createElement("div")

div.className = "card"

div.innerHTML = `

<div>

<b>${p.descricao}</b><br>

Cod: ${p.codigo}<br>

R$ ${p.valorUnit.toFixed(2)}<br>

<small>
Min: ${p.pedidoMin}
</small>

</div>

<div class="qty">

<input
type="number"
min="1"
value="${p.pedidoMin}"
id="q_${p.codigo}">

<button data-cod="${p.codigo}">
Add
</button>

</div>
`

fragment.appendChild(div)

})

lista.appendChild(fragment)

}

lista.addEventListener("click", e=>{

if(e.target.tagName !== "BUTTON")
return

const codigo =
e.target.dataset.cod

if(!codigo) return

addItem(codigo)

})

function addItem(codigo){

const input =
document.getElementById(
"q_"+codigo
)

const qtd =
parseInt(input.value)

const prod =
produtos.find(
p=>p.codigo === codigo
)

if(qtd < prod.pedidoMin){

alert(
"Pedido mínimo: "
+ prod.pedidoMin
)

return

}

pedido[codigo] = {

codigo:prod.codigo,

produto:prod.descricao,

qtd,

valor:prod.valorUnit,

fornecedor:prod.fornecedor,

descontoPercent:0,

descontoValor:0

}

renderPedido()

}

function renderPedido(){

pedidoBox.innerHTML = ""

let subtotalPedido = 0

const fragment =
document.createDocumentFragment()

Object.values(pedido)
.forEach(p=>{

const subtotalOriginal =
p.qtd * p.valor

const descontoPercent =
(p.descontoPercent || 0)

const descontoValor =
(p.descontoValor || 0)

const valorDescontoPercent =
subtotalOriginal *
(descontoPercent / 100)

const subtotal =
subtotalOriginal
- valorDescontoPercent
- descontoValor

subtotalPedido += subtotal

const div =
document.createElement("div")

div.innerHTML = `

<b>${p.produto}</b><br>

${p.codigo}
-
${p.qtd}x
-
R$ ${subtotal.toFixed(2)}

<br><br>

<label>Desc. %</label>

<input
type="number"
min="0"
step="0.01"
value="${descontoPercent}"
style="width:80px"
onchange="
pedido['${p.codigo}'].descontoPercent =
parseFloat(this.value)||0;
renderPedido();
">

<label>Desc. R$</label>

<input
type="number"
min="0"
step="0.01"
value="${descontoValor}"
style="width:80px"
onchange="
pedido['${p.codigo}'].descontoValor =
parseFloat(this.value)||0;
renderPedido();
">

<br><br>

<small>

Subtotal original:
R$ ${subtotalOriginal.toFixed(2)}

</small>

<br><br>

<button
onclick="removerItem('${p.codigo}')">

❌ Remover

</button>

<hr>
`

fragment.appendChild(div)

})

pedidoBox.appendChild(fragment)

const descontoTotalPercent =
parseFloat(
document.getElementById(
"descontoTotalPercent"
).value
) || 0

const descontoTotalValor =
parseFloat(
document.getElementById(
"descontoTotalValor"
).value
) || 0

const valorDescPercent =
subtotalPedido *
(descontoTotalPercent / 100)

const totalFinal =
subtotalPedido
- valorDescPercent
- descontoTotalValor

document.getElementById(
"totalPedido"
).innerHTML = `

Subtotal:
R$ ${subtotalPedido.toFixed(2)}

<br>

Desconto:
R$ ${(valorDescPercent + descontoTotalValor).toFixed(2)}

<br><br>

TOTAL FINAL:
R$ ${totalFinal.toFixed(2)}

`

}

function removerItem(codigo){

delete pedido[codigo]

renderPedido()

}

function gerarPDF(){

const cliente =
document.getElementById("cliente").value || "-"

const observacao =
document.getElementById("observacao").value || ""

const dataAtual =
new Date().toLocaleDateString("pt-BR")

const fornecedores = {}

Object.values(pedido).forEach(p=>{

if(!fornecedores[p.fornecedor]){

fornecedores[p.fornecedor] = []

}

fornecedores[p.fornecedor].push(p)

})

for(const fornecedor in fornecedores){

const { jsPDF } = window.jspdf

const pdf = new jsPDF("p","mm","a4")

let y = 15

try{

pdf.addImage(
"./logo_conecta.png",
"PNG",
10,
10,
25,
25
)

}catch(e){

console.log("Logo não carregada")

}

pdf.setFontSize(18)

pdf.text(
"Conecta Varejo",
40,
18
)

pdf.setFontSize(11)

pdf.text(
"18 99617 0377",
40,
25
)

y = 45

pdf.setFontSize(12)

pdf.text(
`Data: ${dataAtual}`,
10,
y
)

pdf.text(
`Pedido: ${numeroPedido}`,
80,
y
)

y += 8

pdf.text(
`Cliente: ${cliente}`,
10,
y
)

y += 12

pdf.setFontSize(14)

pdf.text(
`Fornecedor: ${fornecedor}`,
10,
y
)

y += 10

pdf.setFontSize(10)

pdf.setFont(
"helvetica",
"bold"
)

pdf.text("Código",10,y)

pdf.text("Qtd",35,y)

pdf.text("V.Unit",50,y)

pdf.text("Desc",75,y)

pdf.text("V.Total",95,y)

pdf.text("Descrição",125,y)

y += 2

pdf.line(10,y,200,y)

y += 6

pdf.setFont(
"helvetica",
"normal"
)

let totalPedido = 0

for(const p of fornecedores[fornecedor]){

const subtotalOriginal =
p.qtd * p.valor

const valorDescPercent =
subtotalOriginal *
((p.descontoPercent || 0) / 100)

const descontoLinha =
valorDescPercent +
(p.descontoValor || 0)

const totalItem =
subtotalOriginal
- valorDescPercent
- (p.descontoValor || 0)

totalPedido += totalItem

const descricao =
pdf.splitTextToSize(
p.produto,
70
)

pdf.text(
String(p.codigo),
10,
y
)

pdf.text(
String(p.qtd),
35,
y
)

pdf.text(
"R$ " + p.valor.toFixed(2),
50,
y
)

pdf.text(
"R$ " + descontoLinha.toFixed(2),
75,
y
)

pdf.text(
"R$ " + totalItem.toFixed(2),
95,
y
)

pdf.text(
descricao,
125,
y
)

y += Math.max(
descricao.length * 5,
8
)

if(y > 260){

pdf.addPage()

y = 20

}

}

const descontoTotalPercent =
parseFloat(
document.getElementById(
"descontoTotalPercent"
).value
) || 0

const descontoTotalValor =
parseFloat(
document.getElementById(
"descontoTotalValor"
).value
) || 0

const valorDescPercentPedido =
totalPedido *
(descontoTotalPercent / 100)

const totalFinal =
totalPedido
- valorDescPercentPedido
- descontoTotalValor

y += 5

pdf.line(10,y,200,y)

y += 10

pdf.setFont(
"helvetica",
"bold"
)

pdf.setFontSize(13)

pdf.text(
"Subtotal: R$ "
+ totalPedido.toFixed(2),
10,
y
)

y += 8

pdf.text(
"Desconto Geral: R$ "
+ (valorDescPercentPedido + descontoTotalValor).toFixed(2),
10,
y
)

y += 8

pdf.text(
"TOTAL FINAL: R$ "
+ totalFinal.toFixed(2),
10,
y
)

y += 15

pdf.setFontSize(12)

pdf.text(
"Observações:",
10,
y
)

y += 8

pdf.setFont(
"helvetica",
"normal"
)

const linhasObs =
pdf.splitTextToSize(
observacao,
180
)

pdf.text(
linhasObs,
10,
y
)

const nomeFornecedor =
fornecedor
.replace(/\s+/g,"_")
.replace(/[^\w]/g,"")

pdf.save(
`${nomeFornecedor}_pedido_${numeroPedido}.pdf`
)

}

}

function gerarExcel(){

let dados = [[
"Fornecedor",
"Codigo",
"Produto",
"Qtd",
"Valor Unit",
"Desconto %",
"Desconto R$",
"Subtotal"
]]

Object.values(pedido)
.forEach(p=>{

const subtotalOriginal =
p.qtd * p.valor

const valorDescPercent =
subtotalOriginal *
((p.descontoPercent || 0) / 100)

const subtotal =
subtotalOriginal
- valorDescPercent
- (p.descontoValor || 0)

dados.push([

p.fornecedor,

p.codigo,

p.produto,

p.qtd,

p.valor,

p.descontoPercent,

p.descontoValor,

subtotal

])

})

let ws =
XLSX.utils.aoa_to_sheet(dados)

let wb =
XLSX.utils.book_new()

XLSX.utils.book_append_sheet(
wb,
ws,
"Pedido"
)

XLSX.writeFile(
wb,
"pedido_"+numeroPedido+".xlsx"
)

}

function novoPedido(){

pedido = {}

numeroPedido =
gerarNumeroPedido()

document.getElementById(
"pedidoNumero"
).innerText =
"Pedido " + numeroPedido

document.getElementById(
"observacao"
).value = ""

document.getElementById(
"descontoTotalPercent"
).value = 0

document.getElementById(
"descontoTotalValor"
).value = 0

renderPedido()

}

let buscaTimer

document.getElementById("busca")
.addEventListener("input", ()=>{

clearTimeout(buscaTimer)

buscaTimer = setTimeout(()=>{

renderCatalogo()

},300)

})

document.getElementById(
"filtroCategoria"
).addEventListener(
"change",
renderCatalogo
)

document.getElementById(
"filtroFornecedor"
).addEventListener(
"change",
renderCatalogo
)

if("serviceWorker" in navigator){

window.addEventListener(
"load",
()=>{

navigator.serviceWorker

.register("./sw.js")

.then(reg=>{

console.log(
"SW registrado",
reg
)

})

.catch(err=>{

console.log(
"Erro SW",
err
)

})

})
}

carregarCatalogo()

</script>

</body>
</html>
